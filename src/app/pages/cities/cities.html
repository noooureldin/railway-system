<div class="cities-page">
  <div class="page-header">

    <span class="page-label">
      EXPLORE EGYPT
    </span>


  </div>
  <div class="cities-grid">

    @for (governorate of governorates; track governorate.name) {

      <div class="city-card">
        <div class="city-image">
          <img
            [src]="governorate.image"
            [alt]="governorate.name"
          >
        </div>

        <div class="city-info">
          <h2>
            {{ governorate.name }}
          </h2>


          <h3>
            Capital:
            {{ governorate.capital }}
          </h3>


          <p>
            {{ governorate.description }}
          </p>


          <!-- ================= CITIES ================= -->

          @if (governorate.cities.length > 0) {

            <div class="major-cities">

              <span class="cities-label">
                Major Cities
              </span>


              <div class="city-tags">

                @for (city of governorate.cities; track city) {

                  <span class="city-tag">
                    {{ city + " | "}}
                  </span>

                }

              </div>

            </div>

          }

          <button
            type="button"
            class="explore-btn"
            (click)="openLink(governorate.link)"
          >
            Explore
          </button>

        </div>

      </div>

    }

  </div>

</div>
